[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "make_my_figure_core"
description = "Reusable core engine for manuscript-style scientific figures (Make My Figure)."
readme = "README.md"
requires-python = ">=3.9"
dynamic = ["version"]
dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
    "matplotlib>=3.6",
    "scipy>=1.9",
    "statsmodels>=0.14",
    "openpyxl>=3.0",
    "jsonschema>=4.0",
    "networkx>=3.0",
    "adjustText>=1.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.30"]
desktop = ["PySide6>=6.5"]
build = ["pyinstaller>=6.0", "pillow>=9.0"]
dev = ["pytest>=7.0", "pytest-qt>=4.2"]

[project.urls]
Homepage = "https://example.com/make-my-figure"   # placeholder — replace with real URL
Repository = "https://github.com/your-org/make-my-figure"  # placeholder

[tool.setuptools.dynamic]
version = { attr = "make_my_figure_core.version.__version__" }

[tool.setuptools.packages.find]
include = ["make_my_figure_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
