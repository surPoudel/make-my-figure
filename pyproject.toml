[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "make_my_figure_core"
description = "Reusable core engine for manuscript-style scientific figures (Make My Figure)."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
dynamic = ["version"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Visualization",
]
# Lower bounds are what the code needs; upper bounds stop at the next major version so a
# clean install a year from now resolves to something the test suite has actually seen.
# Exact versions the release was tested with are in requirements-lock.txt.
dependencies = [
    "pandas>=1.5,<3",
    "numpy>=1.23,<3",
    "matplotlib>=3.6,<4",
    "scipy>=1.9,<2",
    "statsmodels>=0.14,<0.16",
    "openpyxl>=3.0,<4",
    "jsonschema>=4.0,<5",
    "networkx>=3.0,<4",
    "adjustText>=1.0,<2",
    "pillow>=9.0,<13",
]

[project.optional-dependencies]
app = ["streamlit>=1.30,<2"]
desktop = ["PySide6>=6.5,<7"]
build = ["pyinstaller>=6.0", "pillow>=9.0"]
dev = ["pytest>=7.0,<10", "pytest-qt>=4.2,<5"]
# Optional: import PDF/SVG figures as Figure Builder panels (raster formats work
# without these). PyMuPDF handles PDF; cairosvg handles SVG.
import-panels = ["pymupdf>=1.23", "cairosvg>=2.5"]
# Optional, opt-in only: Python-only count-model differential analysis (PyDESeq2 —
# no R, no rpy2). Not required for the core install or tests. See
# docs/COUNT_MODEL_DE_INVESTIGATION.md.
count-de = ["pydeseq2>=0.4"]

[project.urls]
Homepage = "https://github.com/surPoudel/make-my-figure"
Repository = "https://github.com/surPoudel/make-my-figure"

[tool.setuptools.dynamic]
version = { attr = "make_my_figure_core.version.__version__" }

[tool.setuptools.packages.find]
include = ["make_my_figure_core*"]

# Resource folders are staged into make_my_figure_core/_bundled/ by setup.py at build time
# (they live at the project root in a checkout). Declaring them here keeps them in the wheel.
[tool.setuptools.package-data]
make_my_figure_core = ["_bundled/**/*"]

[tool.setuptools]
include-package-data = true

[tool.pytest.ini_options]
testpaths = ["tests"]
