name: Build desktop releases

# Builds standalone desktop apps for Windows, macOS, and Linux.
# On a version tag (v*), the built installers are attached directly to the
# matching GitHub Release. Release assets are stored separately from Actions
# artifacts, so they do NOT count against the Actions artifact-storage quota.
# A manual (workflow_dispatch) run just builds + smoke-tests; it publishes
# nothing (tag a version to cut a release).
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed to create/upload GitHub Release assets

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[desktop,build]"

      - name: Generate placeholder icons
        run: python scripts/make_icons.py

      # ---- Linux ----
      - name: Install Linux AppImage tooling
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 fuse || true
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O /usr/local/bin/appimagetool || true
          chmod +x /usr/local/bin/appimagetool || true
      - name: Build Linux app
        if: runner.os == 'Linux'
        run: |
          chmod +x scripts/build_linux.sh
          ./scripts/build_linux.sh || true
          python -m PyInstaller packaging/make_my_figure.spec --noconfirm

      # ---- macOS ----
      - name: Build macOS app
        if: runner.os == 'macOS'
        env:
          # Optional Apple signing — only used if these repository secrets exist.
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          chmod +x scripts/build_macos.sh
          ./scripts/build_macos.sh

      # ---- Windows ----
      - name: Install Inno Setup (for a double-click Setup.exe)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build Windows app
        if: runner.os == 'Windows'
        env:
          # Optional Windows signing — only used if these repository secrets exist.
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          ./scripts/build_windows.ps1

      - name: Smoke-test built app (Linux/macOS)
        if: runner.os != 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ./dist/MakeMyFigure/MakeMyFigure --selftest

      - name: Smoke-test built app (Windows)
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          .\dist\MakeMyFigure\MakeMyFigure.exe --selftest

      - name: Publish installers to the GitHub Release
        # Attaches this platform's installers to the Release for the tag being
        # built. Release assets live outside the Actions artifact-storage quota,
        # so this never hits the "Artifact storage quota" limit that previously
        # blocked uploads. Tag builds only (a Release exists only for a tag).
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*.dmg dist/*.AppImage dist/*.exe dist/*-windows.zip dist/*-macos.zip dist/*-linux-*.tar.gz)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No installer files found in dist/ — nothing to publish."
            exit 0
          fi
          # Create the Release if it doesn't exist yet. The three matrix jobs run
          # in parallel, so one wins the create and the others get "already
          # exists"; '|| true' lets those proceed straight to the upload.
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Make My Figure $GITHUB_REF_NAME" \
            --notes "Automated build. Download the installer for your platform below." \
            --verify-tag || true
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber

# Notes:
# * Unsigned builds are expected; signing steps run only when the relevant
#   secrets are present (see docs/CODE_SIGNING.md). Absent secrets must NOT fail
#   the build.
# * Tagging v* builds and publishes a Release with installer assets. Assets are
#   Release storage (not Actions artifacts), so they don't consume the artifact
#   quota. Release notes can be edited afterwards with `gh release edit <tag>`.
